name: site
on:
  push:
    branches: [dev]
  workflow_dispatch:
  workflow_run:            # a push made by the 'run a packet' workflow does not trigger this one: deploy when it finishes
    workflows: ['run a packet']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The gate
        run: node tools/gate.mjs
      - name: Assemble the site
        run: |
          mkdir -p _site
          for f in $(git ls-files | cut -d/ -f1 | sort -u); do case "$f" in .github|tools|_site) ;; *) cp -r "$f" _site/ ;; esac; done   # every tracked file and folder (pages, assets, css, stage, harness, handover, stories, reviews): no fixed list to forget
          echo "{\"commit\":\"${GITHUB_SHA}\",\"built_at\":\"$(date -u +%FT%TZ)\",\"run\":\"${GITHUB_RUN_NUMBER}\"}" > _site/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
