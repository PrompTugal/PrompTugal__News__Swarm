<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Swarm Map</title>
<meta name="description" content="The plan of the swarm demo, rung by rung: what each run adds, what ran, and what comes next. Rendered from MAP.md.">
<style>
:root{--bg:#04100F;--panel:#0a1d1b;--ink:#EAF6F3;--muted:#8DB3AC;--line:#1E3A37;--a3:#5ec2ff;--a1:#4fd1a5}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--a3)}main{max-width:900px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.7rem;line-height:1.2;margin:.6em 0 .4em}h2{font-size:1.2rem;margin:1.8em 0 .5em;padding-top:.6em;border-top:1px solid var(--line)}h3{font-size:1rem;margin:1.2em 0 .3em}
blockquote{margin:0 0 1em;padding:8px 14px;border-left:3px solid var(--line);color:var(--muted);background:var(--panel);border-radius:0 8px 8px 0}
code{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:.88em;overflow-wrap:anywhere}
.wrap{overflow-x:auto;margin:0 0 1em}table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}th{color:var(--muted);font-weight:600}
td strong{color:var(--a1)}.src{color:var(--muted);font-size:.8rem;margin-top:2em}
@media (max-width:640px){table{font-size:.85rem}}
</style>
</head>
<body>
<main><article id="doc"><p class="src">Loading the map…</p></article>
<p class="src">Rendered from <a href="https://github.com/PrompTugal/PrompTugal__News__Swarm/blob/dev/MAP.md">MAP.md</a> in this repository. Independent of Web Summit.</p></main>
<script>
// a small Markdown renderer, enough for MAP.md: headings, quotes, tables, lists, paragraphs, **bold**, `code`, [links](…), bare URLs
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const inline = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
  .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => `<a href="${u.replace(/^(?!https?:|#|\/)/, '../')}">${t}</a>`)
  .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2">$2</a>');
function md(src) {
  const L = src.replace(/\r/g, '').split('\n'), out = []; let i = 0;
  while (i < L.length) {
    const l = L[i];
    if (!l.trim()) { i++; continue; }
    let m;
    if ((m = /^(#{1,3})\s+(.*)/.exec(l))) { out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
    if (/^>/.test(l)) { const q = []; while (i < L.length && /^>/.test(L[i])) q.push(L[i++].replace(/^>\s?/, '')); out.push(`<blockquote>${inline(q.join(' '))}</blockquote>`); continue; }
    if (/^\|/.test(l)) { const rows = []; while (i < L.length && /^\|/.test(L[i])) rows.push(L[i++]); const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
      const head = cells(rows[0]), body = rows.slice(2).map(cells);
      out.push(`<div class="wrap"><table><thead><tr>${head.map((c) => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${body.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`); continue; }
    if (/^\s*([-*]|\d+\.)\s/.test(l)) { const ord = /^\s*\d+\./.test(l), it = []; while (i < L.length && /^\s*([-*]|\d+\.)\s/.test(L[i])) it.push(L[i++].replace(/^\s*([-*]|\d+\.)\s+/, ''));
      out.push(`<${ord ? 'ol' : 'ul'}>${it.map((x) => `<li>${inline(x)}</li>`).join('')}</${ord ? 'ol' : 'ul'}>`); continue; }
    const p = []; while (i < L.length && L[i].trim() && !/^(#|>|\||\s*([-*]|\d+\.)\s)/.test(L[i])) p.push(L[i++]); out.push(`<p>${inline(p.join(' '))}</p>`);
  }
  return out.join('\n');
}
fetch('../MAP.md', { cache: 'no-store' }).then((r) => r.text()).then((t) => { document.getElementById('doc').innerHTML = md(t); }).catch(() => { document.getElementById('doc').innerHTML = '<p>The map did not load. <a href="../MAP.md">Read MAP.md</a>.</p>'; });
</script>
<script type="module" src="../assets/feedback.js"></script>
<script src="../assets/nav.js"></script>
</body>
</html>
